<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PUEBLO MEM &mdash; Wing Info</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: #0a0e1a; color: #e8edf5; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { flex-shrink: 0; height: 48px; background: #0f1524; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 12px; padding: 0 18px; }
    .topbar-accent { width: 4px; height: 24px; background: #7c3aed; border-radius: 2px; }
    .topbar-name   { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .topbar-badge  { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: rgba(124,58,237,0.15); color: #c4b5fd; border: 1px solid #7c3aed; }
    .topbar-url    { margin-left: auto; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
    .topbar-link   { flex-shrink: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 12px; border-radius: 4px; border: 1px solid #7c3aed; color: #c4b5fd; background: rgba(124,58,237,0.15); text-decoration: none; transition: background 0.15s; }
    .topbar-link:hover { background: rgba(255,255,255,0.08); }
    #loading { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1); border-top-color: #7c3aed; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
    #wing-frame { flex: 1; border: none; background: #fff; display: none; }
    #fallback { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px; text-align: center; }
    .fallback-icon  { font-size: 56px; opacity: 0.25; }
    .fallback-title { font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
    .fallback-body  { font-size: 13px; color: rgba(255,255,255,0.4); line-height: 1.7; max-width: 400px; }
    .fallback-btn   { display: inline-block; padding: 12px 28px; border-radius: 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; text-decoration: none; background: #7c3aed; color: #fff; transition: opacity 0.15s; }
    .fallback-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-accent"></div>
    <div class="topbar-name">PUEBLO MEM</div>
    <div class="topbar-badge">Air National Guard</div>
    <div class="topbar-url">https://www.140wg.ang.af.mil/</div>
    <a class="topbar-link" href="https://www.140wg.ang.af.mil/" target="_blank" rel="noopener">Open in New Tab &#8599;</a>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading PUEBLO MEM&hellip;</div>
  </div>

  <iframe id="wing-frame" src="https://www.140wg.ang.af.mil/" title="PUEBLO MEM Wing Website" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

  <div id="fallback">
    <div class="fallback-icon">&#128506;</div>
    <div class="fallback-title">PUEBLO MEM</div>
    <div class="fallback-body">
      This wing&rsquo;s official website cannot be embedded directly due to its security settings,
      but you can visit it in a new tab below.
    </div>
    <a class="fallback-btn" href="https://www.140wg.ang.af.mil/" target="_blank" rel="noopener">Visit Wing Website &#8599;</a>
  </div>

  <script>
    var frame    = document.getElementById("wing-frame");
    var loading  = document.getElementById("loading");
    var fallback = document.getElementById("fallback");
    var resolved = false;

    function showIframe() {
      if (resolved) return;
      resolved = true;
      loading.style.display = "none";
      frame.style.display   = "block";
    }

    function showFallback() {
      if (resolved) return;
      resolved = true;
      loading.style.display  = "none";
      frame.style.display    = "none";
      fallback.style.display = "flex";
    }

    frame.addEventListener("load", function() {
      try {
        var doc = frame.contentDocument || frame.contentWindow.document;
        if (doc && doc.body && doc.body.innerHTML.trim().length > 0) {
          showIframe();
        } else {
          showFallback();
        }
      } catch (e) {
        showFallback();
      }
    });

    setTimeout(function() { showFallback(); }, 6000);
  <\/script>

</body>
</html>
