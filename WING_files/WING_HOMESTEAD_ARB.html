<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HOMESTEAD ARB — Wing Info</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: #0a0e1a; color: #e8edf5; display: flex; flex-direction: column; overflow: hidden; }

    /* Top bar */
    .topbar { flex-shrink: 0; height: 48px; background: #0f1524; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 12px; padding: 0 18px; }
    .topbar-accent { width: 4px; height: 24px; background: #065f46; border-radius: 2px; }
    .topbar-name   { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .topbar-badge  { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: rgba(6,120,90,0.15); color: #6ee7b7; border: 1px solid #065f46; }
    .topbar-url    { margin-left: auto; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }

    /* Main content area */
    .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 40px; text-align: center; }
    .content-icon  { font-size: 56px; opacity: 0.2; line-height: 1; }
    .content-name  { font-size: 22px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.85); }
    .content-url   { font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 0.04em; word-break: break-all; max-width: 400px; }

    /* Big button */
    .open-btn {
      display: inline-block;
      padding: 18px 44px;
      background: #065f46;
      color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .open-btn:hover  { opacity: 0.88; transform: translateY(-1px); }
    .open-btn:active { opacity: 1;    transform: translateY(0); }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-accent"></div>
    <div class="topbar-name">HOMESTEAD ARB</div>
    <div class="topbar-badge">Air Force Reserve</div>
    <div class="topbar-url">https://www.482fw.afrc.af.mil/</div>
  </div>

  <div class="content">
    <div class="content-icon">&#128506;</div>
    <div class="content-name">HOMESTEAD ARB</div>
    <a class="open-btn" href="https://www.482fw.afrc.af.mil/" target="_blank" rel="noopener">
      Click Here to Open the Base Website &#8599;
    </a>
    <div class="content-url">https://www.482fw.afrc.af.mil/</div>
  </div>

</body>
</html>
