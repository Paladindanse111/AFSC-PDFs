<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LITTLE ROCK AFB</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1b2a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #1b2a3d;
    border: 1px solid #2a3f5f;
    border-radius: 12px;
    padding: 40px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 24px;
    color: #ffffff;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    color: #8899aa;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .link-btn {
    display: inline-block;
    background: #1a73e8;
    color: #ffffff;
    text-decoration: none;
    padding: 12px 32px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    transition: background 0.2s;
  }
  .link-btn:hover {
    background: #1557b0;
  }
  .url-text {
    margin-top: 16px;
    font-size: 12px;
    color: #667788;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#127961;</div>
  <h1>LITTLE ROCK AFB</h1>
  <div class="subtitle">Official Installation Website</div>
  <a href="https://www.littlerock.af.mil" target="_blank" class="link-btn">Visit Official Website &#8599;</a>
  <div class="url-text">https://www.littlerock.af.mil</div>
</div>
</body>
</html>
