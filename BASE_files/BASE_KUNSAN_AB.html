<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KUNSAN AB &mdash; Installation Info</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: #0a0e1a; color: #e8edf5; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { flex-shrink: 0; height: 48px; background: #0f1524; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 12px; padding: 0 18px; }
    .topbar-accent { width: 4px; height: 24px; background: #1e5fa8; border-radius: 2px; }
    .topbar-name   { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .topbar-badge  { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: rgba(185,28,28,0.15); color: #f87171; border: 1px solid rgba(185,28,28,0.5); }
    .topbar-url    { margin-left: auto; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
    .topbar-link   { flex-shrink: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 12px; border-radius: 4px; border: 1px solid #1e5fa8; color: #5ba3f5; background: rgba(30,95,168,0.15); text-decoration: none; transition: background 0.15s; }
    .topbar-link:hover { background: rgba(255,255,255,0.08); }
    #loading { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1); border-top-color: #1e5fa8; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
    #base-frame { flex: 1; border: none; background: #fff; display: none; }
    #fallback { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px; text-align: center; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-accent"></div>
    <div class="topbar-name">KUNSAN AB</div>
    <div class="topbar-badge">Active Duty</div>
    <div class="topbar-url">https://www.kunsan.af.mil</div>
    <a class="topbar-link" href="https://www.kunsan.af.mil" target="_blank" rel="noopener">Open in New Tab &#8599;</a>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading KUNSAN AB&hellip;</div>
  </div>

  <iframe id="base-frame" src="https://www.kunsan.af.mil" title="KUNSAN AB Official Website" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

  <div id="fallback">
    <div class="fallback-body">
      If the website does not load, <a href="https://www.kunsan.af.mil" target="_blank" rel="noopener">click here</a>.
    </div>
  </div>

  <script>
    var frame    = document.getElementById("base-frame") || document.getElementById("wing-frame");
    var loading  = document.getElementById("loading");
    var fallback = document.getElementById("fallback");
    var loaded   = false;  // true once the iframe fires a successful load event
    var resolved = false;  // guard so we only resolve once

    function showIframe() {
      if (resolved) return;
      resolved = true;
      loading.style.display = "none";
      frame.style.display   = "block";
    }

    function showFallback() {
      if (resolved) return;
      resolved = true;
      loading.style.display  = "none";
      frame.style.display    = "none";
      fallback.style.display = "flex";
    }

    // Mark the iframe as loaded when it fires its load event
    frame.addEventListener("load", function() {
      try {
        var doc = frame.contentDocument || frame.contentWindow.document;
        if (doc && doc.body && doc.body.innerHTML.trim().length > 0) {
          loaded = true;
        }
      } catch (e) {
        // Cross-origin block — leave loaded = false
      }
    });

    // After exactly 5 seconds: show iframe if it loaded, fallback if not
    setTimeout(function() {
      if (loaded) { showIframe(); } else { showFallback(); }
    }, 5000);
  </script>

</body>
</html>
